<!DOCTYPE html>
<html lang="ru" id="html-root">
<head>
<meta charset="UTF-8">
<script>!function(){try{var t=localStorage.getItem('hulkfit-theme');if(t==='light'||t==='dark')document.getElementById('html-root').setAttribute('data-theme',t)}catch(e){}}()</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Прогноз выручки — HULK.FIT{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
{% block head_scripts %}{% endblock %}
<style>
/* Токены дизайн-системы Hulk Fit (tokens/colors.css, typography.css, spacing.css).
   Тема следует системной (prefers-color-scheme), атрибут data-theme её перебивает. */
:root{
  --bg:#0a0a0a;--surface:#111111;--surface-hover:#141414;--header-bg:#050505;
  --text:#ffffff;--text-muted:#cccccc;--accent:#39FF14;--accent-rgb:57,255,20;
  --border:#222222;--border-subtle:#1a1a1a;
  --footer-bg:#050505;--footer-text:#cccccc;--card-shadow:none;
  --neutral-rgb:255,255,255;
  --chart-grid:#1a1a1a;--chart-label:#cccccc;
  --font-display:"Bebas Neue","Oswald","Arial Black",Impact,sans-serif;
  --font-ui:"Oswald","Arial Black",Arial,sans-serif;
  --radius-sm:4px;--radius-md:6px;
  --logo-white:block;--logo-dark:none;--ico-sun:inline;--ico-moon:none;
}
@media (prefers-color-scheme: light){:root:not([data-theme=dark]){
  --bg:#f2f2f2;--surface:#ffffff;--surface-hover:#f7f7f7;--header-bg:#ffffff;
  --text:#111111;--text-muted:#555555;--accent:#00AC00;--accent-rgb:0,172,0;
  --border:#e0e0e0;--border-subtle:#ebebeb;
  --footer-bg:#e0e0e0;--footer-text:#222222;--card-shadow:0 2px 8px rgba(0,0,0,.08);
  --neutral-rgb:0,0,0;
  --chart-grid:#e0e0e0;--chart-label:#555555;
  --logo-white:none;--logo-dark:block;--ico-sun:none;--ico-moon:inline;
}}
:root[data-theme=light]{
  --bg:#f2f2f2;--surface:#ffffff;--surface-hover:#f7f7f7;--header-bg:#ffffff;
  --text:#111111;--text-muted:#555555;--accent:#00AC00;--accent-rgb:0,172,0;
  --border:#e0e0e0;--border-subtle:#ebebeb;
  --footer-bg:#e0e0e0;--footer-text:#222222;--card-shadow:0 2px 8px rgba(0,0,0,.08);
  --neutral-rgb:0,0,0;
  --chart-grid:#e0e0e0;--chart-label:#555555;
  --logo-white:none;--logo-dark:block;--ico-sun:none;--ico-moon:inline;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-ui);font-weight:400;
  font-size:14px;line-height:1.45;min-height:100vh;display:flex;flex-direction:column;
  position:relative;isolation:isolate;
}
/* Угловое свечение .hf-corner-glow: 0.08 и 0.05 из противоположных углов */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 0% 0%,rgba(var(--accent-rgb),.08) 0%,transparent 45%),
             radial-gradient(circle at 100% 100%,rgba(var(--accent-rgb),.05) 0%,transparent 45%);}
a{color:var(--accent);}

/* ── Шапка ── */
.topbar{background:var(--header-bg);border-bottom:2px solid var(--accent);
  padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:100;}
.brand{display:flex;align-items:center;gap:14px;min-width:0;}
.brand img{height:30px;width:auto;flex:none;}
.brand .logo-white{display:var(--logo-white);}
.brand .logo-dark{display:var(--logo-dark);}
.brand-sub{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;}
.nav{display:flex;align-items:center;gap:6px;}
.nav a{font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--text);
  text-decoration:none;padding:6px 8px;white-space:nowrap;}
.nav a:hover{opacity:.75;text-decoration:underline;text-underline-offset:3px;}
.nav a.current{color:var(--accent);}
.theme-btn{background:transparent;border:1px solid var(--border);color:var(--accent);
  border-radius:var(--radius-md);width:34px;height:34px;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;}
.theme-btn:hover{border-color:var(--accent);}
.ico-sun{display:var(--ico-sun);}
.ico-moon{display:var(--ico-moon);}

/* ── Страница ── */
.main{width:100%;max-width:1200px;margin:0 auto;padding:28px 24px 48px;flex:1;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:8px;}
.page-title{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:.95;
  text-transform:uppercase;color:var(--accent);}
.page-sub{font-family:var(--font-display);font-size:20px;line-height:1;text-transform:uppercase;
  color:var(--accent);margin-top:8px;}
.page-meta{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);text-align:right;line-height:1.5;}

/* Заголовок раздела — SectionHeading: зелёный 11px заглавными + линия */
.section-heading{display:flex;align-items:center;gap:16px;margin:32px 0 16px;}
.section-heading span{font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--accent);white-space:nowrap;line-height:1;}
.section-heading::after{content:"";flex:1;height:1px;background:var(--border);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  box-shadow:var(--card-shadow);padding:20px;}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--text);margin-bottom:14px;}
.badge{font-weight:700;font-size:12px;letter-spacing:1px;padding:2px 10px;border-radius:var(--radius-sm);
  border:1px solid var(--accent);color:var(--accent);white-space:nowrap;}
.muted{color:var(--text-muted);}
.accent{color:var(--accent);}
.num{text-align:right;font-variant-numeric:tabular-nums;}

/* Таблица — анатомия table-anatomy */
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{background:var(--surface);color:var(--accent);font-weight:700;font-size:11px;letter-spacing:1px;
  text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:2px solid var(--accent);}
.tbl th.num{text-align:right;}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border-subtle);font-size:13px;}
.tbl tbody tr:hover td{background:var(--surface-hover);}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--border);border-bottom:none;}

/* Кнопки и поля — Button.jsx */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent);color:var(--bg);border:1px solid var(--accent);border-radius:var(--radius-md);
  padding:8px 18px;font-family:var(--font-ui);font-weight:700;font-size:12px;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap;}
.btn.ghost{background:transparent;color:var(--accent);}
.btn:hover{opacity:.85;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.field{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);padding:7px 10px;font-family:var(--font-ui);font-size:13px;}
.field:focus{outline:none;border-color:var(--accent);}

/* Пометки: статус передаётся словом и рамкой, не цветом */
.note{border:1px solid var(--accent);border-radius:var(--radius-sm);
  padding:9px 12px;font-size:13px;margin-top:12px;color:var(--text);}
.note b{font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-right:6px;}
.note.quiet{border-color:var(--border);}
.note.quiet b{color:var(--text-muted);}
.err-box{border:1px solid var(--accent);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:13px;}
.err-box::before{content:'ОШИБКА: ';font-weight:700;color:var(--accent);}

/* Футер — ClubFooter */
footer{background:var(--footer-bg);color:var(--footer-text);font-weight:700;font-size:13px;
  letter-spacing:1px;text-transform:uppercase;text-align:center;padding:16px;line-height:1.3;}

@media(max-width:700px){
  .topbar{padding:10px 12px;}
  .brand-sub{display:none;}
  .nav{gap:0;}
  .nav a{padding:6px 6px;font-size:11px;letter-spacing:.5px;}
  .main{padding:20px 14px 40px;}
  .page-title{font-size:28px;}
  .page-meta{text-align:left;}
}
{% block page_css %}{% endblock %}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="logo-white" src="/forecast/static/logo-lockup-white.png" alt="Фитнес-клуб Hulk Fit">
    <img class="logo-dark" src="/forecast/static/logo-lockup-dark.png" alt="Фитнес-клуб Hulk Fit">
    <span class="brand-sub">Прогноз выручки</span>
  </div>
  <nav class="nav">
    <a href="/forecast/" {% if nav == 'forecast' %}class="current"{% endif %}>Прогноз</a>
    <a href="/forecast/settings" {% if nav == 'settings' %}class="current"{% endif %}>Настройки</a>
    <a href="/">Дашборды</a>
    <button class="theme-btn" type="button" onclick="toggleTheme()" aria-label="Сменить тему"><svg class="ico-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><svg class="ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  </nav>
</header>

<div class="main">
{% block content %}{% endblock %}
</div>

<footer>Нижний Тагил, Октябрьской Революции, 66 (5 этаж) · 217-300 · hulk.fit</footer>

<script>
function toggleTheme() {
  const root = document.getElementById('html-root');
  const cur = root.getAttribute('data-theme') ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = cur === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('hulkfit-theme', next); } catch (e) {}
  if (typeof onThemeChange === 'function') onThemeChange();
}
try {
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if (!document.documentElement.getAttribute('data-theme') && typeof onThemeChange === 'function') onThemeChange();
  });
} catch (e) {}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
